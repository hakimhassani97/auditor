services:
  auditor:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/storage/uploads
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - auditor_data:/app/data
      - auditor_uploads:/app/storage/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  auditor_data:
  auditor_uploads:
